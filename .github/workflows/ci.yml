name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep the crate's .cargo/config.toml settings (single-threaded, no-capture
  # tests and `-C target-cpu=native -C target-feature=-fma`).

jobs:
  test:
    name: cargo test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the C reference binary (Linux only)
        if: matrix.os == 'ubuntu-latest'
        working-directory: external/treecode
        run: make

      - name: Run tests
        # Don't use `--all-targets`: the `throughput` bench is `harness = false`,
        # so `cargo test` would *execute* it in debug profile (vs the C reference
        # built with -O3), making the rust/c timing assertion meaningless/flaky.
        # Benches are meant to run via `cargo bench` (release) locally.
        run: cargo test

      - name: Compile-check benchmarks (no execution)
        # Build the benches to catch compile errors without running the timing
        # assertion, which must only run in release via `cargo bench`.
        run: cargo build --benches

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly for rustfmt
        # The repo's rustfmt.toml relies on nightly-only options, matching the
        # pre-commit `cargo +nightly fmt` hook.
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo +nightly fmt --all --check

      - name: cargo clippy
        # The nightly install above makes nightly the default toolchain, so pin
        # clippy explicitly to stable (which has the clippy component added).
        run: cargo +stable clippy --all-targets -- -D warnings
