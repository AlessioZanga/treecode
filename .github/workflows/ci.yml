name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep the crate's .cargo/config.toml settings (single-threaded, no-capture
  # tests and `-C target-cpu=native -C target-feature=-fma`).

jobs:
  test:
    name: cargo test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the C reference binary (Linux only)
        if: matrix.os == 'ubuntu-latest'
        working-directory: external/treecode
        run: make

      - name: Run tests
        run: cargo test --all-targets

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly for rustfmt
        # The repo's rustfmt.toml relies on nightly-only options, matching the
        # pre-commit `cargo +nightly fmt` hook.
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo +nightly fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
